name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    # FreeRDP >= 3.11 is needed; Fedora ships current FreeRDP 3.
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git meson gcc gtk4-devel freerdp-devel \
            gobject-introspection-devel python3-gobject gi-docgen \
            xorg-x11-server-Xvfb xorg-x11-xauth

      - uses: actions/checkout@v4

      - name: Build (defaults + docs + examples)
        run: |
          meson setup _build -Ddocumentation=true -Dexamples=true
          meson compile -C _build

      - name: Test
        run: xvfb-run -a meson test -C _build --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: _build/meson-logs/testlog.txt

  windows:
    # MSYS2 UCRT64: GTK 4, FreeRDP 3, PyGObject (the usual way GTK apps are
    # built for Windows). GTK can create windows on the runner's desktop.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-freerdp
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-python-gobject

      - uses: actions/checkout@v4

      - name: Build
        run: |
          meson setup _build -Dexamples=true
          meson compile -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-windows
          path: _build/meson-logs/testlog.txt
